name: HTTP2 CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal:
          - 1.20.0
          - 1.21.0

    steps:
      - uses: actions/checkout@v4
      - uses: crystallang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install
      - name: Install nghttp2 interoperability server
        run: |
          sudo apt-get update
          sudo apt-get install --yes nghttp2-server
          nghttpd --version
      - name: Build Ameba
        run: shards build ameba -Dpreview_mt
      - name: Check formatting
        run: crystal tool format --check
      - name: Run Ameba
        run: bin/ameba
      - name: Run specs
        run: crystal spec -t -s
      - name: Run preview_mt specs
        run: crystal spec -Dpreview_mt -t -s
      - name: Run nghttp2 interoperability specs
        run: spec/interop/run_nghttp2.sh
      - name: Run preview_mt nghttp2 interoperability specs
        run: spec/interop/run_nghttp2.sh -Dpreview_mt
      - name: Build shard
        run: crystal build src/http2.cr
      - name: Build documentation
        if: matrix.crystal == '1.21.0'
        run: crystal docs
